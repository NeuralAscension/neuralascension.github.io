AE" font-family="'Verdana'" font-size="14.5833" lengthAdjust="spacing" textLength="767.9464" x="742.6432" y="987.9669">or a derived data.lfp (NP2), then fires StimulatorClient (UDP) at the stim server (production: Raspberry Pi</text><text fill="#ADAFAE" font-family="'Verdana'" font-size="14.5833" lengthAdjust="spacing" textLength="807.6589" x="742.6432" y="1004.9428">3B+; the ESP32-S3 is an interchangeable twin) driving an AM Systems 2300, whose biphasic pulse is captured</text><text fill="#ADAFAE" font-family="'Verdana'" font-size="14.5833" lengthAdjust="spacing" textLength="726.653" x="742.6432" y="1021.9187">on the NI-DAQ (ai4). Closing the last browser quits the backend after a 2 s grace (a refresh is safe).</text></g><?plantuml-src TLPjRnev4Fw-ls8k9zsnIWc4j595TPK8IIyqWT3Tj5IwdYgpQy1YTxsrJHBkvR_VC_P2IAlB1-BrZCVpyimp_icjP2afsywrMRRrnXMgaf5TgweMHfGq5zbwQVIcoeUwq8P-xlLw1sBMTjjQaZPkfGy4bSwbbJMzx1vi6b6jUVFLguDDknAvVb3LaXQYi39ooXMIqbgjfPrAiQOsNQdbgdqZxsL10vEjb9EPsnX9lz25S8BU5VhXIzNAT5cAAhUqm3V1PlM2SfRpjwLD_OQCgciORxybwrH9MQ6jpAdGkYPT4L81ZUNAnL4aCeTeFrffegX63iHIqj6vWI5fY5hlK-fGcgdXIXWN7v6mzEwI_ew8_fX8zw3DUbWeMRa_MJ8PylweD7eiAXWoVdSqJcvvF_4-ZNM-WMUvpjPUcenPjhk1ScNhGcmHvM2Acs_UyUzarBuOV8Yz_l1gaDobqRy7tixad6x4LXhltkpoFFY7xHItI9TASuzW-gUzivVUnYnDMU7gxcvA_TVTrrs_ov_Fx0vrvOmklDNXNN8Jp8w5gXf9qKGuzd6dUcCoUHXvwcER6fr9QxKv54szw5e2ZiBaDyewMJMYwniMuOg5Mj8n9N89gL7IXdnT_lxCoK7sRQEiSWfrfHON1A6wbP4Yjw5UW-67NS4sHjVgKHOs-8eiJ-h7KpWubvpc-h4tJlrNoFLa-ja7fifD8PpC6OJXP0Xl56gthTmg57TlTlMAk8pjXIfa7tPwQ8a7-WUhKnBrSR6emmrfuYin6Q6-1vOd8rzX1lLSM2w5CXbyCEURnKAQBvMeuI-iu9SDTwXIkVWMAdL-a9qczznqrAftXNYUdsboEmm9kWZWsnUCKVZfSuzALNLAyHXSlfXwZzM5-FQzVl0zA0Ja9ZBJ9iTYiCcLzlBRkwlBvAaVBYGtkRyhdINSdHprILK_dkopb5nmDWxhHrUpWDbPn0H4HoctkVL0XwMfehFpO-JxCfsUzSY1TU8l5TXWCARUMRVhuuOCDdrhKGlGBFIIeDSK0BjHz2lznd_KC0xLmgseJmuq0cFCF44XOlwWDlP00PEXNw79eFe-lPrGLeAike-dtMutIiO7qeQcM0wlhMC6w20C1pAeAexJVt5mJHDto4dhtYaZuuXjiAtn4AOoZGCP7-UIy3-n0ScEWpFen6Q5nhk-QOv5QN26STui6P2xNO1m6fOeQRD2AVPPyPpRf6IkdTCbPsLJDpcvcksCGrxLNnboKy64P